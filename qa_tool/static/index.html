<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boy.co.jp QA ツール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #111;
      color: #fff;
      padding: 1rem 1.5rem;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.05em; }
    header p { font-size: 0.75rem; opacity: 0.6; margin-top: 0.2rem; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }
    .user {
      align-self: flex-end;
      background: #111;
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .bot {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #ddd;
      border-bottom-left-radius: 3px;
      color: #222;
    }
    .bot.loading { color: #999; font-style: italic; }
    footer {
      padding: 0.9rem 1.5rem;
      background: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 0.5rem;
    }
    #q {
      flex: 1;
      padding: 0.65rem 0.9rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    #q:focus { border-color: #111; box-shadow: 0 0 0 2px rgba(0,0,0,0.1); }
    button {
      padding: 0.65rem 1.25rem;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button:not(:disabled):hover { opacity: 0.8; }
  </style>
</head>
<body>

<header>
  <h1>横浜銀行 QA アシスタント</h1>
  <p>横浜銀行（boy.co.jp）に関する質問にお答えします</p>
</header>

<div id="chat">
  <div class="msg bot">
    こんにちは！横浜銀行に関するご質問をどうぞ。<br>
    例：「どんなサービスがありますか？」「口座開設はどうすればいいですか？」
  </div>
</div>

<footer>
  <input id="q" type="text" placeholder="質問を入力してください…" autocomplete="off" />
  <button id="send">送信</button>
</footer>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('q');
  const btn = document.getElementById('send');

  function addMsg(text, cls) {
    const div = document.createElement('div');
    div.className = `msg ${cls}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function ask() {
    const question = input.value.trim();
    if (!question) return;

    input.value = '';
    btn.disabled = true;
    addMsg(question, 'user');
    const loading = addMsg('考え中…', 'bot loading');

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      loading.className = 'msg bot';
      loading.textContent = data.answer || data.error || '（応答なし）';
    } catch {
      loading.className = 'msg bot';
      loading.textContent = 'エラー：サーバーに接続できませんでした。';
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  btn.addEventListener('click', ask);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>

</body>
</html>
